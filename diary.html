<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Movie Diary</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="bg-blur"></div>

  <header class="site-header glass">
    <nav class="nav">
      <a class="brand" href="./index.html">🎬 Glass Movies</a>
      <div class="links">
        <a class="link" href="./index.html">Now Playing</a>
        <a class="link active" href="./diary.html">Movie Diary</a>
      </div>
    </nav>
    <div class="header-content">
      <h1>Movie Diary</h1>
    </div>
  </header>

  <main class="container">
    <button id="show-form-btn" class="btn primary" style="margin-bottom:1rem">+ Add Movie</button>

    <!-- Entry form -->
    <section class="glass card form-card hidden">
      <form id="entry-form" class="form-grid" autocomplete="off">
        <div class="field span-2" style="position:relative">
          <label>Title</label>
          <input id="title" type="search" placeholder="Search movie…" required />
          <ul id="search-suggestions" class="glass suggestions"></ul>
        </div>
        <div class="field">
          <label>Date watched</label>
          <input id="date" type="date" required />
        </div>
        <div class="field">
          <label>Rating (0–10)</label>
          <div class="rating-row">
            <input id="rating" type="range" min="0" max="10" step="0.5" value="7" />
            <output id="rating-out">7</output>
          </div>
        </div>
        <div class="field">
          <label>Watch type</label>
          <select id="watch-type">
            <option value="first">First watch</option>
            <option value="rewatch">Rewatch</option>
          </select>
        </div>
        <div class="field span-2">
          <label>Notes</label>
          <textarea id="notes" rows="3" placeholder="Thoughts…"></textarea>
        </div>
        <div class="field span-2">
          <label>Poster URL</label>
          <input id="poster-url" type="url" placeholder="Auto-filled when you pick from search" />
        </div>
        <div class="actions span-2">
          <button class="btn primary" type="submit">Add to Diary</button>
          <button class="btn subtle" type="button" id="clear-form-btn">Cancel</button>
        </div>
      </form>
    </section>

    <section class="glass card">
      <div class="filters">
        <input id="q" type="search" placeholder="Search title/notes…" />
        <select id="filter-type">
          <option value="all">All</option>
          <option value="first">First watch</option>
          <option value="rewatch">Rewatch</option>
        </select>
        <select id="sort">
          <option value="date-desc">Date ↓</option>
          <option value="date-asc">Date ↑</option>
          <option value="rating-desc">Rating ↓</option>
          <option value="rating-asc">Rating ↑</option>
        </select>
        <button id="export-btn" class="btn">Export JSON</button>
        <label class="file-btn btn">
          Import JSON
          <input id="import-file" type="file" accept="application/json" hidden />
        </label>
      </div>
    </section>

    <section class="diary-list" id="diary-list"></section>
  </main>

  <script src="./diary.js" defer></script>
</body>
</html>
