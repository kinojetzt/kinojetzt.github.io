<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Movie Diary — Glass Movies</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="bg-blur"></div>

    <header class="site-header glass">
      <nav class="nav">
        <a class="brand" href="./index.html">🎬 Glass Movies</a>
        <div class="links">
          <a class="link" href="./index.html">Now Playing</a>
          <a class="link active" href="./diary.html">Movie Diary</a>
        </div>
      </nav>
      <div class="header-content">
        <h1>Movie Diary</h1>
        <p class="muted">Log your watches. Data is saved locally in your browser.</p>
      </div>
    </header>

    <main class="container">
      <!-- Entry form -->
      <section class="glass card form-card">
        <h2>Add Entry</h2>
        <form id="entry-form" class="form-grid">
          <div class="field">
            <label>Title</label>
            <input id="title" type="text" placeholder="Movie title" required />
          </div>

          <div class="field">
            <label>Date watched</label>
            <input id="date" type="date" required />
          </div>

          <div class="field">
            <label>Rating (0–10)</label>
            <div class="rating-row">
              <input id="rating" type="range" min="0" max="10" step="0.5" value="7" />
              <output id="rating-out">7</output>
            </div>
          </div>

          <div class="field">
            <label>Watch type</label>
            <select id="watch-type">
              <option value="first">First watch</option>
              <option value="rewatch">Rewatch</option>
            </select>
          </div>

          <div class="field span-2">
            <label>Notes</label>
            <textarea id="notes" rows="3" placeholder="Thoughts…"></textarea>
          </div>

          <div class="field span-2">
            <label>Poster (optional)</label>
            <div class="poster-row">
              <input id="poster-url" type="url" placeholder="Paste poster URL or use TMDB search" />
              <button class="btn" type="button" id="find-poster-btn">Find Poster</button>
            </div>
            <small class="muted">Tip: use “Find Poster” to search TMDB and pick an image.</small>
          </div>

          <div class="actions">
            <button class="btn primary" type="submit">Add to Diary</button>
            <button class="btn subtle" type="button" id="clear-form-btn">Clear</button>
          </div>
        </form>
      </section>

      <!-- Filters -->
      <section class="glass card">
        <h2>Filter & Sort</h2>
        <div class="filters">
          <input id="q" type="search" placeholder="Search title/notes…" />
          <select id="filter-type">
            <option value="all">All</option>
            <option value="first">First watch</option>
            <option value="rewatch">Rewatch</option>
          </select>
          <select id="sort">
            <option value="date-desc">Date ↓</option>
            <option value="date-asc">Date ↑</option>
            <option value="rating-desc">Rating ↓</option>
            <option value="rating-asc">Rating ↑</option>
            <option value="title-asc">Title A–Z</option>
            <option value="title-desc">Title Z–A</option>
          </select>
          <button id="export-btn" class="btn">Export JSON</button>
          <label class="file-btn btn">
            Import JSON
            <input id="import-file" type="file" accept="application/json" hidden />
          </label>
        </div>
      </section>

      <!-- Diary list -->
      <section class="diary-list" id="diary-list"></section>
    </main>

    <footer class="site-footer glass">
      <small class="muted">Your diary is stored in this browser (localStorage). Export regularly if you care about backup.</small>
    </footer>

    <template id="poster-picker-template">
      <dialog class="glass picker">
        <form method="dialog" class="picker-inner">
          <h3>Pick a poster</h3>
          <div class="picker-grid" id="picker-grid"></div>
          <div class="picker-actions">
            <button value="cancel" class="btn subtle">Cancel</button>
          </div>
        </form>
      </dialog>
    </template>

    <script src="./diary.js" defer></script>
  </body>
</html>
