<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>TMDB Demo (key in frontend)</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <h1>Trending Movies</h1>
      <div class="search">
        <input id="search-input" type="search" placeholder="Search TMDB…" />
        <button id="search-button" type="button">Search</button>
        <small class="hint">Powered by TMDB (key exposed in JS)</small>
      </div>
    </header>

    <main>
      <div id="movie-list" class="grid"></div>

      <!-- Speech bubble -->
      <div id="speech-bubble" class="bubble hidden" aria-live="polite">
        <button class="bubble-close" id="bubble-close" aria-label="Close">×</button>
        <div id="trailer-container" class="trailer"></div>
        <div id="bubble-content"></div>
      </div>
    </main>

    <script src="./script.js" defer></script>
  </body>
</html>
